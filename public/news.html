<!doctype html>
<html lang="ko" data-default-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>사이버보안 모니터, 뉴스</title>
<link rel="icon" href="data:,">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="news.css">
</head>
<body class="reading news-page">
<header class="top">
  <a class="brand" href="index.html" aria-label="사이버보안 모니터 첫 화면">
    <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1 2 4v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m6.5 11 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>사이버보안 <span>모니터</span></h1>
  </a>
  <nav aria-label="페이지">
    <a href="index.html">종목</a>
    <a href="positions.html">밸류체인</a>
    <a href="news.html" aria-current="page">뉴스</a>
    <a href="incidents.html">보안 사고</a>
    <a href="events.html">주요 이벤트</a>
  </nav>
  <div class="status" aria-live="polite">
    <span id="status-text">불러오는 중</span>
    <button type="button" class="theme-btn" data-theme-toggle>라이트 모드</button>
  </div>
  <span class="company-name" lang="en">Capital Research &amp; Foem Invest</span>
</header>
<main>
  <div class="news-overview">
    <section aria-labelledby="recent-title">
      <header class="news-section-head">
        <h2 id="recent-title">최근 24시간 새 침해사고</h2>
        <p>국내외 첫 보도, 최신순 (KST)</p>
      </header>
      <div class="news-stream" id="recent-incidents" role="region" aria-labelledby="recent-title" tabindex="0">
        <p class="recent-message">기사를 불러오는 중</p>
      </div>
    </section>
    <section aria-labelledby="major-title">
      <header class="news-section-head">
        <h2 id="major-title">그간의 주요 침해사고</h2>
        <p>최근 4주, 영향 범위 5만 이상 또는 금전 피해 1천만 달러 이상</p>
      </header>
      <div class="news-stream" id="major-incidents" role="region" aria-labelledby="major-title" tabindex="0">
        <p class="recent-message">사고 기록을 불러오는 중</p>
      </div>
    </section>
  </div>

  <div class="tabs news-tabs" id="news-library" role="tablist" aria-label="기사와 정책 자료">
    <button id="tab-search" type="button" role="tab" aria-selected="true" aria-controls="view-search" data-view="search">기사 검색</button>
    <button id="tab-policy" type="button" role="tab" aria-selected="false" aria-controls="view-policy" data-view="policy" tabindex="-1">정책과 기업 대응</button>
  </div>

  <section id="view-search" role="tabpanel" aria-labelledby="tab-search">
    <div class="tools news-tools">
      <input class="search" id="search" type="search" placeholder="기업, 키워드 검색" aria-label="뉴스 검색">
      <div class="seg-switch" role="group" aria-label="지역" id="region-switch">
        <button type="button" data-region="ALL" aria-pressed="false">전체</button>
        <button type="button" data-region="KR" aria-pressed="true">국내</button>
        <button type="button" data-region="GL" aria-pressed="false">해외</button>
      </div>
      <div class="seg-switch" role="group" aria-label="기사 기간" id="period-switch">
        <button type="button" data-period="7" aria-pressed="false">7일</button>
        <button type="button" data-period="30" aria-pressed="true">30일</button>
        <button type="button" data-period="0" aria-pressed="false">전체 기간</button>
      </div>
      <select class="search" id="search-category" aria-label="기사 유형">
        <option value="all">모든 기사</option>
        <option value="incident">해킹 사례</option>
        <option value="policy">정책</option>
        <option value="spending">기업 대응과 지출</option>
        <option value="briefs">출처 확인 자료</option>
      </select>
    </div>
    <section class="panel" aria-labelledby="feed-title">
      <header><h2 id="feed-title" tabindex="-1">기사 목록</h2><p id="feed-sub" aria-live="polite"></p></header>
      <div id="feed"></div>
    </section>
  </section>

  <section id="view-policy" role="tabpanel" aria-labelledby="tab-policy" hidden>
    <div class="tools policy-tools">
      <div class="seg-switch" role="group" aria-label="정리 유형" id="policy-switch">
        <button type="button" data-topic="policy" aria-pressed="true">정책</button>
        <button type="button" data-topic="spending" aria-pressed="false">기업 대응과 지출</button>
      </div>
      <button type="button" id="policy-to-search">관련 최신 기사 보기</button>
    </div>
    <section class="panel" aria-labelledby="digest-title">
      <header><h2 id="digest-title">정책 정리</h2><p>원문 출처와 진행 상황</p></header>
      <div id="digest"></div>
    </section>
  </section>
  <p class="notes" id="notes"></p>
</main>
<script type="module" src="news.js"></script>
</body>
</html>
