<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>사이버보안 모니터, 뉴스</title>
<link rel="icon" href="data:,">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>사이버보안 <span>모니터</span></h1>
  <nav aria-label="페이지">
    <a href="index.html">종목</a>
    <a href="news.html" aria-current="page">뉴스</a>
  </nav>
  <div class="status" aria-live="polite">
    <span id="status-text">불러오는 중</span>
    <button type="button" class="theme-btn" data-theme-toggle>라이트 모드</button>
  </div>
</header>
<main>
  <div class="tabs" role="tablist" aria-label="뉴스 범주" id="tabs">
    <button type="button" role="tab" data-tab="incident" aria-selected="true">해킹 사례<small></small></button>
    <button type="button" role="tab" data-tab="policy" aria-selected="false">정책<small></small></button>
    <button type="button" role="tab" data-tab="spending" aria-selected="false">기업 대응과 지출<small></small></button>
  </div>
  <div class="tools">
    <div class="seg-switch" role="group" aria-label="지역" id="region-switch">
      <button type="button" data-region="ALL" aria-pressed="true">전체</button>
      <button type="button" data-region="KR" aria-pressed="false">국내</button>
      <button type="button" data-region="GL" aria-pressed="false">해외</button>
    </div>
    <div class="seg-switch" role="group" aria-label="헤드라인 기간" id="period-switch">
      <button type="button" data-period="7" aria-pressed="false">7일</button>
      <button type="button" data-period="30" aria-pressed="true">30일</button>
      <button type="button" data-period="0" aria-pressed="false">전체</button>
    </div>
    <input class="search" id="search" type="search" placeholder="기업, 키워드 검색" aria-label="뉴스 검색">
    <span class="count" id="count"></span>
  </div>
  <p class="jump"><a href="#cards-title">정리 카드</a><a href="#headlines-title">자동 수집 헤드라인</a></p>
  <div class="news-layout">
    <section class="panel" aria-labelledby="cards-title">
      <header><h2 id="cards-title">주요 사건과 정책 정리</h2><p>1차 출처를 확인해 정리한 카드</p></header>
      <div id="cards"></div>
    </section>
    <section class="panel" aria-labelledby="headlines-title">
      <header><h2 id="headlines-title">자동 수집 헤드라인</h2><p id="headlines-sub"></p></header>
      <div id="headlines"></div>
    </section>
  </div>
  <p class="notes" id="notes"></p>
</main>
<script type="module" src="news.js"></script>
</body>
</html>
