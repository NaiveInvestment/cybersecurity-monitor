<!doctype html>
<html lang="ko" data-default-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>사이버보안 모니터, 종목</title>
<link rel="icon" href="data:,">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="security-alerts.css">
</head>
<body class="app">
<header class="top">
  <a class="brand" href="index.html" aria-label="사이버보안 모니터 첫 화면">
    <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1 2 4v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m6.5 11 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>사이버보안 <span>모니터</span></h1>
  </a>
  <nav aria-label="페이지">
    <a href="index.html" aria-current="page">종목</a>
    <a href="news.html">뉴스</a>
    <a href="market-composition.html">시총 구성</a>
    <a href="events.html">주요 이벤트</a>
    <a href="positions.html">밸류체인</a>
  </nav>
  <div class="status" aria-live="polite">
    <span id="status-text">불러오는 중</span>
    <span class="badge" id="status-badge" hidden></span>
    <button type="button" class="theme-btn" data-theme-toggle>라이트 모드</button>
  </div>
  <span class="company-name" lang="en">Capital Research &amp; FOEM Invest</span>
</header>
<a class="issue-bar" id="issue-bar" href="news.html" hidden></a>
<main>
  <section aria-label="섹터 요약">
    <div class="kpi-controls">
      <div class="seg-switch" role="group" aria-label="국내외 요약 수익률 가중 방식" id="kpi-weight-switch">
        <button type="button" data-weight="equal" aria-pressed="false">동일가중</button>
        <button type="button" data-weight="cap" aria-pressed="true" title="기간 시작 시가총액 추정치 기준, 해외는 원화 환산">시총가중</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>
  <div class="market-charts">
    <section class="sector-panel" id="sector-panel" aria-label="섹터 상대주가"></section>
    <section class="sector-panel domestic-market" id="domestic-market" aria-label="국내 보안주 시총과 거래대금 추이" hidden></section>
  </div>
  <section class="table-section" aria-label="종목 표">
    <div class="tools">
      <div class="seg-switch" role="group" aria-label="지역" id="view-switch">
        <button type="button" data-view="KR" aria-pressed="true">국내</button>
        <button type="button" data-view="GL" aria-pressed="false">해외</button>
        <button type="button" data-view="ALL" aria-pressed="false">전체</button>
      </div>
      <div class="seg-switch" role="group" aria-label="금액 표시" id="cur-switch">
        <button type="button" data-cur="krw" aria-pressed="true">원화 환산</button>
        <button type="button" data-cur="local" aria-pressed="false">현지 통화</button>
      </div>
      <input class="search" id="search" type="search" placeholder="종목명, 코드 검색" aria-label="종목 검색">
      <div class="chips" id="seg-chips" role="group" aria-label="분야"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="finance-tools" id="finance-tools">
      <label>컨센서스 <select id="financial-horizon"><option value="threeMonth">3M 평균</option><option value="oneMonth">1M 평균</option><option value="highest">3M 최고</option></select></label>
      <span id="financial-date"></span>
    </div>
    <div class="table-pan" id="table-pan" tabindex="0" aria-label="종목 표 좌우 이동" hidden></div>
    <div class="table-wrap" id="table-wrap"></div>
  </section>
</main>
<dialog id="score-dialog" aria-labelledby="score-title">
  <form>
    <h2 id="score-title">종목 점수</h2>
    <label for="stock-score-input">내 점수</label>
    <input id="stock-score-input" name="score" type="number" step="any" inputmode="decimal" aria-describedby="score-help">
    <p id="score-help">이 브라우저에 저장됩니다. 점수를 지우려면 칸을 비우고 저장하세요.</p>
    <p role="alert"></p>
    <div class="score-actions"><button type="button" data-cancel>취소</button><button type="submit">저장</button></div>
  </form>
</dialog>
<dialog id="short-balance-dialog" aria-labelledby="short-balance-title">
  <header><h2 id="short-balance-title">공매도 순보유잔고</h2>
    <form method="dialog"><button type="submit" aria-label="공매도 상세 닫기">×</button></form></header>
  <div data-short-balance-detail></div>
  <p class="short-balance-note">KRX 보고대상 순보유잔고 합계. 기준일로부터 2거래일 뒤 공개됩니다.</p>
  <a href="https://data.krx.co.kr/comm/srt/srtLoader/index.cmd?screenId=MDCSTAT305" target="_blank" rel="noopener noreferrer">KRX 순보유잔고 원문 ↗</a>
</dialog>
<dialog id="market-warning-dialog" aria-labelledby="market-warning-title">
  <header><h2 id="market-warning-title">시장경보</h2><button type="button" data-warning-close aria-label="시장경보 닫기" autofocus>×</button></header>
  <div class="warning-detail"></div>
</dialog>
<script type="module" src="app.js"></script>
<script type="module" src="sectors.js"></script>
<script type="module" src="security-alerts.js"></script>
</body>
</html>
